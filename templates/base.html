<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="vendor/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #f6f1e7;
      }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #f6f1e7;
        font-family: Geist, system-ui, sans-serif;
        color: #1c1c1c;
      }
      /* faint dotted paper texture */
      #paper {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(28,28,28,0.05) 1.2px, transparent 1.2px);
        background-size: 28px 28px;
      }
      .beat { position: absolute; inset: 0; overflow: hidden; }
      .eyebrow {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 34px; font-weight: 600; letter-spacing: 10px; color: #8a8378;
      }
      .hook-line {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 116px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em;
        white-space: nowrap; color: #1c1c1c;
      }
      .hook-line .w { display: inline-block; }
      .red { color: #d9481f; }
      .blue { color: #2b5ea7; }
      .chart-title {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 40px; font-weight: 800; letter-spacing: 6px; color: #1c1c1c;
      }
      .chart-sub {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 30px; font-weight: 500; color: #8a8378;
      }
      .axis-label { font-size: 28px; font-weight: 600; fill: #8a8378; }
      .month-label { font-size: 28px; font-weight: 600; fill: #8a8378; text-anchor: middle; }
      .peak-label { font-size: 44px; font-weight: 800; }
      .caption-line {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 34px; font-weight: 600; color: #5c564a; font-style: italic;
      }
      .scale-label { font-size: 30px; font-weight: 600; fill: #8a8378; }
      .note { font-size: 28px; font-weight: 500; fill: #8a8378; font-style: italic; }
      .diagram-title {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 44px; font-weight: 800; letter-spacing: 6px; color: #1c1c1c;
      }
      .part-label { font-size: 32px; font-weight: 600; fill: #5c564a; }
      .close-line {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 104px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;
        white-space: nowrap; color: #1c1c1c;
      }
      .close-line .w { display: inline-block; }
      .close-sub {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-size: 38px; font-weight: 600; color: #8a8378;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="%%TOTAL%%"
      data-width="1080"
      data-height="1920"
    >
      <div id="paper"></div>

%%BEATS%%
    </div>

    <script>
      (function () {
        "use strict";
        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        function prepDraw(path) {
          var len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          return len;
        }
        function dashLen(sel) { return document.querySelector(sel).getTotalLength(); }

%%TIMELINE%%

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
