<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="../lib/gsap.min.js"></script>
<script src="../lib/SplitText.min.js"></script>
<style>
  @font-face { font-family:"EchoesDisplay"; src:url("../lib/ArchivoBlack-Regular.ttf") format("truetype"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:#000; overflow:hidden; }
  #root { position:relative; width:1080px; height:1920px; background:#000;
    font-family:"EchoesDisplay","Arial Black",Arial,sans-serif; color:#fff; }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .card { position:absolute; top:980px; left:0; width:1080px; text-align:center; }
  .rule { width:260px; height:6px; background:#FFD166; margin:0 auto 40px; }
  .day { font-size:430px; line-height:.9; color:#fff; text-shadow:8px 8px 0 rgba(0,0,0,.85); }
  .month { font-size:118px; letter-spacing:18px; color:#fff; margin-top:26px;
    text-shadow:5px 5px 0 rgba(0,0,0,.9); }
  .year { font-size:190px; letter-spacing:10px; color:#FFD166; margin-top:18px;
    text-shadow:6px 6px 0 rgba(0,0,0,.85); }
  .place { font-size:36px; letter-spacing:8px; color:#c8c8c8; margin-top:44px; }
  .rule2 { width:260px; height:6px; background:#c00; margin:44px auto 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="date-card" data-start="0" data-duration="5" data-width="1080" data-height="1920">
  <div class="card" id="card">
    <div class="rule" id="rule"></div>
    <div class="day" id="day">27</div>
    <div class="month" id="month">JANUARY</div>
    <div class="year" id="year">1980</div>
    <div class="place" id="place">RENDLESHAM FOREST &middot; SUFFOLK</div>
    <div class="rule2" id="rule2"></div>
  </div>
  <div class="vignette"></div>
</div>
<script>
  gsap.registerPlugin(SplitText);
  var sm = new SplitText("#month", {type:"chars"});
  var sy = new SplitText("#year", {type:"chars"});
  var tl = gsap.timeline({paused:true});
  tl.fromTo("#rule", {scaleX:0}, {scaleX:1, duration:0.5, ease:"power3.inOut"}, 0);
  tl.fromTo("#day", {opacity:0, y:160, scale:0.85}, {opacity:1, y:0, scale:1, duration:0.6, ease:"power3.out"}, 0.3);
  tl.fromTo(sm.chars, {opacity:0, y:30}, {opacity:1, y:0, duration:0.35, stagger:0.07, ease:"power2.out"}, 0.95);
  tl.fromTo(sy.chars, {opacity:0, y:34, scale:1.15}, {opacity:1, y:0, scale:1, duration:0.35, stagger:0.09, ease:"back.out(1.6)"}, 1.75);
  tl.fromTo("#place", {opacity:0}, {opacity:1, duration:0.5, ease:"power2.out"}, 2.55);
  tl.fromTo("#rule2", {scaleX:0}, {scaleX:1, duration:0.4, ease:"power3.inOut"}, 2.55);
  tl.to("#card", {scale:1.015, duration:2.0, ease:"sine.inOut"}, 3.0);
  tl.to({}, {duration:0.01}, 5.0);
  window.__timelines = window.__timelines || {};
  window.__timelines["date-card"] = tl;
  tl.seek(0);
</script>
</body>
</html>
