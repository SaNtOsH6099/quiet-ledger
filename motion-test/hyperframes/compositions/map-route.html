<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="../lib/gsap.min.js"></script>
<script src="../lib/DrawSVGPlugin.min.js"></script>
<script src="../lib/MotionPathPlugin.min.js"></script>
<style>
  @font-face { font-family:"EchoesDisplay"; src:url("../lib/ArchivoBlack-Regular.ttf") format("truetype"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:#000; overflow:hidden; }
  #root { position:relative; width:1080px; height:1920px; background:#070707;
    font-family:"EchoesDisplay","Arial Black",Arial,sans-serif; }
  svg { display:block; width:1080px; height:1920px; }
  .lbl { font-family:"EchoesDisplay",Arial,sans-serif; fill:#e8e8e8; }
  .lbl-small { font-family:Arial,sans-serif; font-weight:700; fill:#9a9a9a; letter-spacing:3px; }
  .lbl-gold { font-family:"EchoesDisplay",Arial,sans-serif; fill:#FFD166; }
</style>
</head>
<body>
<div id="root" data-composition-id="map-route" data-start="0" data-duration="5" data-width="1080" data-height="1920">
<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#070707"/>
  <g id="grid" stroke="#141414" stroke-width="2">
    <line x1="0" y1="320" x2="1080" y2="320"/><line x1="0" y1="640" x2="1080" y2="640"/>
    <line x1="0" y1="960" x2="1080" y2="960"/><line x1="0" y1="1280" x2="1080" y2="1280"/>
    <line x1="0" y1="1600" x2="1080" y2="1600"/>
    <line x1="270" y1="0" x2="270" y2="1920"/><line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>
  <path id="coast" d="M0,420 C90,400 140,520 150,700 C160,880 110,1020 130,1200 C150,1380 100,1560 120,1920 L0,1920 Z"
    fill="#0e1410" stroke="#2a2a2a" stroke-width="3"/>
  <path id="forest" d="M560,760 C700,700 880,760 920,900 C960,1040 860,1180 720,1160 C580,1140 480,1000 500,880 C510,820 520,790 560,760 Z"
    fill="#101a12" stroke="#233026" stroke-width="3"/>
  <text class="lbl-small" x="60" y="180" font-size="30">SUFFOLK</text>
  <text class="lbl-small" x="60" y="220" font-size="26" fill="#666">ENGLAND &middot; 1980</text>
  <g id="roads" stroke="#2e2e2e" stroke-width="5" fill="none">
    <path d="M120,1920 L420,1200 L700,900 L980,700"/>
    <path d="M0,1500 L540,1380 L1080,1420"/>
  </g>
  <text class="lbl" id="lbl-forest" x="600" y="740" font-size="34" opacity="0">RENDLESHAM</text>
  <text class="lbl" id="lbl-forest2" x="600" y="782" font-size="34" opacity="0">FOREST</text>
  <path id="route" d="M180,1680 C300,1500 380,1380 470,1240 C560,1100 620,1000 700,920 C760,850 820,800 880,760"
    fill="none" stroke="#FFD166" stroke-width="7" stroke-linecap="round"/>
  <circle id="startpin" cx="180" cy="1680" r="16" fill="#c00" stroke="#fff" stroke-width="4" opacity="0"/>
  <text class="lbl-small" id="lbl-start" x="210" y="1720" font-size="28" opacity="0">WOODBRIDGE</text>
  <circle id="dot" cx="180" cy="1680" r="20" fill="#FFD166" stroke="#000" stroke-width="4" opacity="0"/>
  <circle id="endpin" cx="880" cy="760" r="0" fill="#c00" stroke="#fff" stroke-width="5"/>
  <text class="lbl-gold" id="lbl-end" x="640" y="700" font-size="40" opacity="0">THE LIGHTS</text>
  <text class="lbl-small" id="lbl-end2" x="640" y="738" font-size="26" opacity="0">27 DECEMBER 1980</text>
  <g id="compass">
    <circle cx="960" cy="180" r="52" fill="none" stroke="#555" stroke-width="3"/>
    <text class="lbl" x="944" y="196" font-size="36">N</text>
    <line x1="960" y1="140" x2="960" y2="128" stroke="#c00" stroke-width="4"/>
  </g>
  <g id="scalebar">
    <rect x="80" y="1820" width="200" height="10" fill="#888"/>
    <text class="lbl-small" x="80" y="1800" font-size="26">2 MILES</text>
  </g>
</svg>
</div>
<script>
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
  var tl = gsap.timeline({paused:true});
  tl.fromTo("#coast, #forest, #roads", {opacity:0}, {opacity:1, duration:0.8, ease:"power2.out"}, 0);
  tl.fromTo("#startpin", {opacity:0, scale:0}, {opacity:1, scale:1, duration:0.4, ease:"back.out(2)", transformOrigin:"50% 50%"}, 0.4);
  tl.fromTo("#lbl-start", {opacity:0}, {opacity:1, duration:0.4}, 0.5);
  tl.fromTo("#dot", {opacity:0}, {opacity:1, duration:0.2}, 0.8);
  tl.fromTo("#route", {drawSVG:"0%"}, {drawSVG:"100%", duration:2.6, ease:"power1.inOut"}, 0.8);
  tl.to("#dot", {motionPath:{path:"#route", align:"#route", alignOrigin:[0.5,0.5]}, duration:2.6, ease:"power1.inOut"}, 0.8);
  tl.fromTo("#lbl-forest, #lbl-forest2", {opacity:0, y:14}, {opacity:1, y:0, duration:0.5, stagger:0.1, ease:"power2.out"}, 1.6);
  tl.to("#endpin", {attr:{r:22}, duration:0.45, ease:"back.out(2.5)"}, 3.5);
  tl.fromTo("#lbl-end", {opacity:0, scale:0.8}, {opacity:1, scale:1, duration:0.45, ease:"back.out(1.7)", transformOrigin:"0% 50%"}, 3.55);
  tl.fromTo("#lbl-end2", {opacity:0}, {opacity:1, duration:0.4}, 3.8);
  tl.to("#dot", {opacity:0, duration:0.4}, 4.4);
  tl.to({}, {duration:0.01}, 5.0);
  window.__timelines = window.__timelines || {};
  window.__timelines["map-route"] = tl;
  tl.seek(0);
</script>
</body>
</html>
