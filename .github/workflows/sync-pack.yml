# Sync the asset pack to Google Drive.
#
# The pack's asset files live on Drive, not in the repo: the repo holds
# only the catalog (assets/catalog.json), the tools, and the pipeline
# code. This workflow uploads a local pack directory to Drive,
# mirroring its relative paths, idempotently (unchanged files are
# skipped by md5, changed files are updated in place).
#
# How it runs: the pack files reach Actions on a temporary branch.
# Push the pack there, dispatch this workflow on that branch, and
# delete the branch after the sync succeeds, so the main branch never
# carries the pack files. Manual dispatch only.
#
# The catalog, the tools, and the pack docs live in the repo and are
# never uploaded (the sync only uploads .svg files). The staging
# intermediates are excluded; only the final asset files and the
# sources go up.
name: sync-pack

on:
  workflow_dispatch:
    inputs:
      pack_dir:
        description: "Local pack directory to upload (relative to repo root)"
        required: false
        default: "assets"
        type: string
      drive_subdir:
        description: "Drive folder under DRIVE_FOLDER_ID to mirror into"
        required: false
        default: "assets"
        type: string
      dry_run:
        description: "Dry run: show what would change without uploading"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: extract the pack archives
        run: |
          for f in pack-part*.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f"
          done
          echo "extracted assets:"; find assets -name "*.svg" | wc -l
      - name: sync the pack to Drive
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ARGS="--pack-dir ${{ inputs.pack_dir }} --drive-subdir ${{ inputs.drive_subdir }} --exclude staging"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 -m pipeline.drive.sync_pack $ARGS
