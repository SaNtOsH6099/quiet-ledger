# quiet-ledger: draft the words, draw the scenes, narrate, assemble,
# file the finished piece in Drive.
#
# Two modes, chosen by the `stage` input (manual runs) or the schedule:
#   draft  - take one topic, draft the script and scene plan, save it in
#            the queue as script-ready. A person reviews and approves it.
#   render - take the next approved queue entry and run it all the way
#            through: narration, drawn scenes, captions, assembly,
#            thumbnail, Drive upload.
# The daily schedule runs in render mode. Nothing renders without an
# approved entry, and the schedule exits quietly when there is none.
#
# Approval is the human gate between the two modes, so the draft job is
# NOT a `needs` dependency of the render chain: the render chain reads
# the approved script from the queue in Drive instead.
name: quiet-ledger

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to draft (draft mode), or leave empty to use the next queue idea"
        required: false
        type: string
      queue_id:
        description: "Queue entry id to render (render mode), or leave empty for the next approved entry"
        required: false
        type: string
      stage:
        description: "draft = write the script only; render = build the finished file"
        required: true
        default: draft
        type: choice
        options: [draft, render]
      format:
        description: "Video format: shorts (1080x1920) or longform (1920x1080)"
        required: false
        default: shorts
        type: choice
        options: [shorts, longform]
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily, render mode

permissions:
  contents: read

concurrency:
  group: quiet-ledger
  cancel-in-progress: false

env:
  HF_VERSION: 0.8.188

jobs:
  draft:
    name: draft the script and scene plan
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject stdlib-shadowing filenames
        run: python3 -m pipeline.tools.check_no_shadow
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: resolve the topic
        id: topic
        env:
          TOPIC_INPUT: ${{ inputs.topic }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          topic = os.environ.get("TOPIC_INPUT", "").strip()
          entry_id = ""
          if not topic:
              r = subprocess.run([sys.executable, "-m", "pipeline.drive.drive_queue", "next", "--status", "idea"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print("no topic given and no 'idea' entry in the queue", file=sys.stderr)
                  print(r.stderr, file=sys.stderr)
                  sys.exit(1)
              entry = json.loads(r.stdout)
              topic, entry_id = entry["topic"], str(entry["id"])
          print(f"topic: {topic}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"topic={topic}\n")
              f.write(f"entry_id={entry_id}\n")
          PY
      - name: draft with the brain
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: python3 -m pipeline.brain.draft "${{ steps.topic.outputs.topic }}" out --format=${{ inputs.format }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: write the scene code with the brain
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: python3 -m pipeline.brain.codegen out/script.json out --format=${{ inputs.format }}
      - uses: actions/upload-artifact@v4
        with:
          name: draft
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: save the draft in the video's own environment folder
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "${{ steps.topic.outputs.entry_id }}" ]; then
            ID="${{ steps.topic.outputs.entry_id }}"
          else
            ID=$(python3 -m pipeline.drive.drive_queue add --topic "${{ steps.topic.outputs.topic }}" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          # The video's environment folder holds the script; queue.json
          # only indexes it (id, topic, status, folder_id, link).
          FOLDER_ID=$(python3 - <<PY
          import json, os, sys
          sys.path.insert(0, ".")
          from pipeline.drive import drive_queue as q
          from pipeline.drive import video_env as env
          service = env.drive_service()
          script = json.load(open("out/script.json"))
          folder_id = env.create_env(service, os.environ.get("DRIVE_FOLDER_ID"), $ID, "${{ steps.topic.outputs.topic }}", script=script)
          print(folder_id)
          PY
          )
          python3 -m pipeline.drive.drive_queue update --id "$ID" --status script-ready --folder-id-entry "$FOLDER_ID"
          echo "queue_id=$ID" >> "$GITHUB_OUTPUT"

  voice:
    name: narrate (one continuous take)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'render')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject stdlib-shadowing filenames
        run: python3 -m pipeline.tools.check_no_shadow
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install speech tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          python3 -m pip install -q -r requirements/voice.txt
      - name: fetch the approved entry's script from its own folder
        id: entry
        env:
          QUEUE_ID_INPUT: ${{ inputs.queue_id }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          qid = os.environ.get("QUEUE_ID_INPUT", "").strip()
          cmd = [sys.executable, "-m", "pipeline.drive.drive_queue"]
          cmd += ["get", "--id", qid] if qid else ["next", "--status", "approved"]
          r = subprocess.run(cmd, capture_output=True, text=True)
          if r.returncode != 0:
              if "no queue entry with status" in r.stderr:
                  print("no approved queue entry to render, exiting quietly")
                  sys.exit(0)
              print("queue read failed", file=sys.stderr)
              print(r.stderr, file=sys.stderr)
              sys.exit(1)
          entry = json.loads(r.stdout)
          # The script lives in the video's own environment folder, not
          # in queue.json. An old-format entry (script embedded, no
          # folder) is migrated into its own folder here.
          from pipeline.drive import drive_queue as q
          from pipeline.drive import video_env as env
          service = env.drive_service()
          root = os.environ.get("DRIVE_FOLDER_ID")
          folder_id = entry.get("folder_id")
          if not folder_id:
              folder_id = env.migrate_entry(service, root, entry)
              qid_int = entry["id"]
              subprocess.run([sys.executable, "-m", "pipeline.drive.drive_queue",
                              "update", "--id", str(qid_int),
                              "--folder-id-entry", folder_id], check=True)
              print(f"migrated queue entry {qid_int} into its own folder")
          script = env.load_script(service, folder_id)
          if not script:
              print(f"video folder {folder_id} has no script.json; "
                    "run the draft stage first", file=sys.stderr)
              sys.exit(1)
          os.makedirs("out", exist_ok=True)
          with open("out/script.json", "w") as f:
              json.dump(script, f, indent=2)
          meta = {"queue_id": entry["id"], "topic": entry["topic"],
                  "folder_id": folder_id}
          with open("out/meta.json", "w") as f:
              json.dump(meta, f, indent=2)
          print(f"rendering entry {entry['id']}: {entry['topic']}")
          PY
      - name: refresh the scene code if it is stale
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # codegen --check regenerates the scene code only when the
          # stored code is stale (older version) or fails validation;
          # a fresh script passes through untouched (no brain calls).
          # This is what stops a re-render from replaying old broken
          # code (entry 3's clipped hook and missing closing text).
          python3 -m pipeline.brain.codegen out/script.json out --check --format=${{ inputs.format }}
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from pipeline.drive import video_env as env
          meta = json.load(open("out/meta.json"))
          service = env.drive_service()
          script = json.load(open("out/script.json"))
          env.save_script(service, meta["folder_id"], script)
          print("script.json saved back to the video's folder")
          PY
      - name: mark the entry rendering
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ID=$(python3 -c "import json; print(json.load(open('out/meta.json'))['queue_id'])")
          python3 -m pipeline.drive.drive_queue update --id "$ID" --status rendering
      - name: narrate
        run: python3 -m pipeline.render.voice --script out/script.json --out out/narration.wav
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: out/
          if-no-files-found: error
          retention-days: 7

  scenes:
    name: draw the scenes
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install transcription tools
        run: python3 -m pip install -q -r requirements/scenes.txt
      - name: install ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - name: draw and render the scenes
        run: python3 -m pipeline.render.render --scenes out/script.json --audio out/narration.wav --templates templates --out-dir out --work-dir work/hf
      - uses: actions/upload-artifact@v4
        with:
          name: scenes
          path: out/
          if-no-files-found: error
          retention-days: 7

  captions:
    name: word-timed captions
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - name: build the caption file
        run: python3 -m pipeline.render.captions --words out/words.json --script out/script.json --out out/captions.ass
      - uses: actions/upload-artifact@v4
        with:
          name: captions
          path: out/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble the finished file
    needs: captions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install caption font and ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: out/
      - name: assemble
        run: |
          TOTAL=$(python3 -c "import json; print(json.load(open('out/timings.json'))['total'])")
          python3 -m pipeline.render.assemble --video out/silent.mp4 --audio out/narration.wav --captions out/captions.ass --out out/final.mp4 --duration "$TOTAL"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: out/
          if-no-files-found: error
          retention-days: 7

  thumbnail:
    name: draw the thumbnail
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install image tools
        run: python3 -m pip install -q -r requirements/thumbnail.txt
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - name: draw the thumbnail
        run: python3 -m pipeline.render.thumbnail --script out/script.json --out out/thumbnail.png
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: out/
          if-no-files-found: error
          retention-days: 7

  upload-drive:
    name: file it in Drive
    needs: [assemble, thumbnail]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: final
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: thumbnail
          path: out/
      - name: upload and mark in-drive
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ID=$(python3 -c "import json; print(json.load(open('out/meta.json'))['queue_id'])")
          TOPIC=$(python3 -c "import json; print(json.load(open('out/meta.json'))['topic'])")
          # File everything into the video's own environment folder, so
          # the folder is the whole video and can be re-assembled from
          # it alone.
          python3 -m pipeline.drive.upload_drive --file out/final.mp4 --thumbnail out/thumbnail.png --script out/script.json --narration out/narration.wav --words out/words.json --captions out/captions.ass --silent out/silent.mp4 --queue-id "$ID" --topic "$TOPIC"

  repair:
    name: repair the code with the brain
    needs: [voice, scenes, captions, assemble, thumbnail, upload-drive]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: stop after three consecutive repairs
        run: |
          if [ "$(git log --format=%s -3 | grep -c '^repair:')" -eq 3 ]; then
            echo "three consecutive brain repairs already; a human needs to look"
            exit 1
          fi
          echo "repair attempts so far: $(git log --format=%s -3 | grep -c '^repair:')"
      - name: fetch the failed log and extract the error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pipeline.repair.fetch_failed_log --run-id "$GITHUB_RUN_ID" --repo "${{ github.repository }}" --out error.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ask the brain for a fix
        id: fix
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          set +e
          python3 -m pipeline.repair.repair --error-file error.txt
          RC=$?
          set -e
          echo "repair_exit=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 3 ]; then
            echo "scene code is bad; regenerating it"
            QID="${{ github.event.inputs.queue_id }}"
            if [ -z "$QID" ]; then
              QID=$(python3 -m pipeline.drive.drive_queue next --status rendering | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
            fi
            if [ -z "$QID" ]; then echo "could not determine queue entry"; exit 1; fi
            echo "queue_id=$QID" >> "$GITHUB_OUTPUT"
            # The script lives in the video's own environment folder, not
            # in queue.json. Fetch it from there, regenerate, save back.
            python3 - <<PY
            import json, os, sys
            sys.path.insert(0, ".")
            from pipeline.drive import drive_queue as q
            from pipeline.drive import video_env as env
            service = env.drive_service()
            queue, _ = q.load_queue(service, os.environ.get("DRIVE_FOLDER_ID"))
            entry = next(e for e in queue["entries"] if e["id"] == $QID)
            folder_id = entry.get("folder_id")
            if not folder_id:
                folder_id = env.migrate_entry(service, os.environ.get("DRIVE_FOLDER_ID"), entry)
            script = env.load_script(service, folder_id)
            json.dump(script, open("/tmp/script.json", "w"), indent=2)
            json.dump({"folder_id": folder_id}, open("/tmp/env.json", "w"))
            PY
            python3 -m pipeline.brain.codegen /tmp/script.json /tmp/codeout --regen
            REGEN=$(python3 -c "import json; print(json.load(open('/tmp/codeout/script.json')).get('code_regen_count', 0))")
            if [ "$REGEN" -gt 3 ]; then
              echo "scene code regenerated $REGEN times and still failing; a human needs to look"
              exit 1
            fi
            python3 - <<'PY'
            import json, os, sys
            sys.path.insert(0, ".")
            from pipeline.drive import video_env as env
            service = env.drive_service()
            folder_id = json.load(open("/tmp/env.json"))["folder_id"]
            script = json.load(open("/tmp/codeout/script.json"))
            env.save_script(service, folder_id, script)
            PY
            python3 -m pipeline.drive.drive_queue update --id "$QID" --status rendering
            echo "regenerated the scene code for queue entry $QID (attempt $REGEN)"
          elif [ "$RC" -ne 0 ]; then
            echo "repair.py failed with exit $RC"
            exit "$RC"
          fi
          exit 0
      - name: commit the fix, reset the entry, and retry
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ "${{ steps.fix.outputs.repair_exit }}" = "3" ]; then
            QID="${{ steps.fix.outputs.queue_id }}"
            python3 -m pipeline.drive.drive_queue update --id "$QID" --status approved
            echo "reset queue entry $QID to approved"
            gh workflow run pipeline.yml --ref main -f stage=render -f queue_id="$QID"
            echo "re-triggered render for queue entry $QID"
            exit 0
          fi
          if git diff --quiet; then
            echo "repair made no change; nothing to commit"
            exit 0
          fi
          git config user.name "quiet-ledger repair"
          git config user.email "repair@quiet-ledger.local"
          git add -A
          git commit -m "repair: brain fix for failed render (run $GITHUB_RUN_ID)"
          git push
          QID="${{ github.event.inputs.queue_id }}"
          if [ -z "$QID" ]; then
            QID=$(python3 -m pipeline.drive.drive_queue next --status rendering | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
          fi
          if [ -n "$QID" ]; then
            python3 -m pipeline.drive.drive_queue update --id "$QID" --status approved
            echo "reset queue entry $QID to approved"
            gh workflow run pipeline.yml --ref main -f stage=render -f queue_id="$QID"
            echo "re-triggered render for queue entry $QID"
          else
            echo "could not determine queue entry; fix committed, re-trigger manually"
          fi
      - name: mark the entry failed when repair gives up
        if: failure()
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # The repair loop gave up (three consecutive repairs, three
          # code regens, or an unfixable error). Mark the entry "failed"
          # and record the error in the video's meta.json, so it is
          # visible instead of sitting at "rendering" forever with no
          # one knowing. A failed entry can be re-approved by hand.
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          from pipeline.drive import drive_queue as q
          from pipeline.drive import video_env as env
          qid = os.environ.get("GITHUB_EVENT_INPUTS_QUEUE_ID", "").strip()
          service = env.drive_service()
          root = os.environ.get("DRIVE_FOLDER_ID")
          queue, _ = q.load_queue(service, root)
          entry = None
          if qid:
              entry = next((e for e in queue["entries"]
                            if str(e["id"]) == qid), None)
          if entry is None:
              entry = q.next_entry(queue, "rendering")
          if entry is None:
              print("no rendering entry to mark failed")
              sys.exit(0)
          subprocess.run([sys.executable, "-m", "pipeline.drive.drive_queue",
                          "update", "--id", str(entry["id"]),
                          "--status", "failed"], check=True)
          folder_id = entry.get("folder_id")
          if folder_id:
              meta = env.load_meta(service, folder_id) or {}
              err = ""
              if os.path.exists("error.txt"):
                  err = open("error.txt").read()[:2000]
              meta.update({
                  "status": "failed",
                  "failed_run": os.environ.get("GITHUB_RUN_ID"),
                  "failed_error": err,
              })
              env.save_meta(service, folder_id, meta)
          print(f"queue entry {entry['id']} marked failed")
          PY
