# quiet-ledger: Muse writes, GitHub renders.
#
# Two halves, split by who does the thinking and who does the computing:
#   Muse (outside Actions) - topic, script, beats, scene code, validation,
#     and a demo render with frame QC. The finished script.json is pushed
#     to the repo under submissions/<slug>/script.json.
#   GitHub Actions (this workflow) - the rendering machine only: ingest
#     the submitted script into Drive, narrate, draw the scenes, caption,
#     assemble, QC, thumbnail, upload to Drive. No model is called from
#     Actions, and no brain keys are needed. The only secrets are the
#     Drive OAuth token and the Drive folder id.
#
# One mode: render. A manual run takes an optional queue_id (render that
# entry, or ingest a submission into it); otherwise it renders the next
# approved entry. The daily schedule (09:00 IST) renders the next
# approved entry, and ingests any new submission first, so a script
# pushed the night before renders in the morning without a manual run.
# Nothing renders without an approved entry, and the schedule exits
# quietly when there is none.
#
# If a render fails, the mark-failed job records it on the queue entry
# and in the video's meta.json. There is no self-healing repair: the
# brain that fixes a failure is Muse, who reads the run log, fixes the
# script or the repo, and submits again.
name: quiet-ledger

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: "Queue entry id to render (or to file a submission into); leave empty for the next approved entry"
        required: false
        type: string
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily

permissions:
  contents: read

concurrency:
  group: quiet-ledger
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest submitted scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: reject stdlib-shadowing filenames
        run: python3 -m pipeline.tools.check_no_shadow
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: file submissions into Drive
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # Validate each submissions/<slug>/script.json and file it into
          # the video's own environment folder, marking the queue entry
          # approved. Exits quietly when there is nothing to ingest, so
          # the daily schedule can run this job on every run. A bad
          # script fails this job and never reaches Drive, so the render
          # chain never sees it.
          ARGS=""
          if [ -n "${{ inputs.queue_id }}" ]; then
            ARGS="--queue-id ${{ inputs.queue_id }}"
          fi
          python3 -m pipeline.drive.ingest $ARGS

  voice:
    name: narrate (one continuous take)
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_entry: ${{ steps.entry.outputs.has_entry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject stdlib-shadowing filenames
        run: python3 -m pipeline.tools.check_no_shadow
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install speech tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          python3 -m pip install -q -r requirements/voice.txt
      - name: fetch the approved entry's script from its own folder
        id: entry
        env:
          QUEUE_ID_INPUT: ${{ inputs.queue_id }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          qid = os.environ.get("QUEUE_ID_INPUT", "").strip()
          cmd = [sys.executable, "-m", "pipeline.drive.drive_queue"]
          cmd += ["get", "--id", qid] if qid else ["next", "--status", "approved"]
          r = subprocess.run(cmd, capture_output=True, text=True)
          if r.returncode != 0:
              if "no queue entry with status" in r.stderr:
                  print("no approved queue entry to render, exiting quietly")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("has_entry=false\n")
                  sys.exit(0)
              print("queue read failed", file=sys.stderr)
              print(r.stderr, file=sys.stderr)
              sys.exit(1)
          entry = json.loads(r.stdout)
          # The script lives in the video's own environment folder, not
          # in queue.json. An old-format entry (script embedded, no
          # folder) is migrated into its own folder here.
          from pipeline.drive import drive_queue as q
          from pipeline.drive import video_env as env
          service = env.drive_service()
          root = os.environ.get("DRIVE_FOLDER_ID")
          folder_id = entry.get("folder_id")
          if not folder_id:
              folder_id = env.migrate_entry(service, root, entry)
              qid_int = entry["id"]
              subprocess.run([sys.executable, "-m", "pipeline.drive.drive_queue",
                              "update", "--id", str(qid_int),
                              "--folder-id-entry", folder_id], check=True)
              print(f"migrated queue entry {qid_int} into its own folder")
          script = env.load_script(service, folder_id)
          if not script:
              print(f"video folder {folder_id} has no script.json; "
                    "submit a script first (see PIPELINE.md)", file=sys.stderr)
              sys.exit(1)
          os.makedirs("out", exist_ok=True)
          with open("out/script.json", "w") as f:
              json.dump(script, f, indent=2)
          meta = {"queue_id": entry["id"], "topic": entry["topic"],
                  "folder_id": folder_id}
          with open("out/meta.json", "w") as f:
              json.dump(meta, f, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("has_entry=true\n")
          print(f"rendering entry {entry['id']}: {entry['topic']}")
          PY
      - name: mark the entry rendering
        if: steps.entry.outputs.has_entry == 'true'
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ID=$(python3 -c "import json; print(json.load(open('out/meta.json'))['queue_id'])")
          python3 -m pipeline.drive.drive_queue update --id "$ID" --status rendering
      - name: narrate
        if: steps.entry.outputs.has_entry == 'true'
        run: python3 -m pipeline.render.voice --script out/script.json --out out/narration.wav
      - uses: actions/upload-artifact@v4
        if: steps.entry.outputs.has_entry == 'true'
        with:
          name: voice
          path: out/
          if-no-files-found: error
          retention-days: 7

  scenes:
    name: draw the scenes
    needs: voice
    if: needs.voice.outputs.has_entry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install transcription tools
        run: python3 -m pip install -q -r requirements/scenes.txt
      - name: install Drive tools
        # The resolver fetches the assets a beat uses from Drive at
        # render time (the pack lives on Drive, not in the repo).
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: install ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - name: draw and render the scenes
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python3 -m pipeline.render.render --scenes out/script.json --audio out/narration.wav --templates templates --out-dir out --work-dir work/hf
      - uses: actions/upload-artifact@v4
        with:
          name: scenes
          path: out/
          if-no-files-found: error
          retention-days: 7

  captions:
    name: word-timed captions
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - name: build the caption file
        run: python3 -m pipeline.render.captions --words out/words.json --script out/script.json --out out/captions.ass
      - uses: actions/upload-artifact@v4
        with:
          name: captions
          path: out/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble the finished file
    needs: captions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install caption font and ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: out/
      - name: assemble
        run: |
          TOTAL=$(python3 -c "import json; print(json.load(open('out/timings.json'))['total'])")
          python3 -m pipeline.render.assemble --video out/silent.mp4 --audio out/narration.wav --captions out/captions.ass --out out/final.mp4 --duration "$TOTAL"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: out/
          if-no-files-found: error
          retention-days: 7

  qc:
    name: frame QC on the finished video
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install QC tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -r requirements/qc.txt
      - uses: actions/download-artifact@v4
        with:
          name: final
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - name: check the rendered frames
        run: python3 -m pipeline.qc.frame_qc --video out/final.mp4 --script out/script.json --timings out/timings.json --out out/qc-report.json --work-dir work/qc
      - uses: actions/upload-artifact@v4
        with:
          name: qc
          path: out/
          if-no-files-found: error
          retention-days: 7

  thumbnail:
    name: draw the thumbnail
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install image tools
        run: python3 -m pip install -q -r requirements/thumbnail.txt
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - name: draw the thumbnail
        run: python3 -m pipeline.render.thumbnail --script out/script.json --out out/thumbnail.png
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: out/
          if-no-files-found: error
          retention-days: 7

  upload-drive:
    name: file it in Drive
    needs: [qc, thumbnail]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: scenes
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: final
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: qc
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: thumbnail
          path: out/
      - name: upload and mark in-drive
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          ID=$(python3 -c "import json; print(json.load(open('out/meta.json'))['queue_id'])")
          TOPIC=$(python3 -c "import json; print(json.load(open('out/meta.json'))['topic'])")
          # File everything into the video's own environment folder, so
          # the folder is the whole video and can be re-assembled from
          # it alone.
          python3 -m pipeline.drive.upload_drive --file out/final.mp4 --thumbnail out/thumbnail.png --script out/script.json --narration out/narration.wav --words out/words.json --captions out/captions.ass --silent out/silent.mp4 --qc-report out/qc-report.json --queue-id "$ID" --topic "$TOPIC"

  mark-failed:
    name: mark the entry failed
    needs: [ingest, voice, scenes, captions, assemble, qc, thumbnail, upload-drive]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: mark the rendering entry failed
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          QUEUE_ID_INPUT: ${{ inputs.queue_id }}
        run: |
          # The render failed and there is no brain in Actions to fix
          # it, so record the failure where it is visible instead of
          # leaving the entry at "rendering" forever with no one
          # knowing: mark the entry "failed" and record the run id in
          # the video's meta.json. Muse reads the run log, fixes the
          # script or the repo, and submits again. A failed entry can
          # be re-approved by submitting a corrected script for it.
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, ".")
          from pipeline.drive import drive_queue as q
          from pipeline.drive import video_env as env
          qid = os.environ.get("QUEUE_ID_INPUT", "").strip()
          service = env.drive_service()
          root = os.environ.get("DRIVE_FOLDER_ID")
          queue, _ = q.load_queue(service, root)
          entry = None
          if qid:
              entry = next((e for e in queue["entries"]
                            if str(e["id"]) == qid), None)
          if entry is None:
              entry = q.next_entry(queue, "rendering")
          if entry is None:
              print("no rendering entry to mark failed")
              sys.exit(0)
          subprocess.run([sys.executable, "-m", "pipeline.drive.drive_queue",
                          "update", "--id", str(entry["id"]),
                          "--status", "failed"], check=True)
          folder_id = entry.get("folder_id")
          if folder_id:
              meta = env.load_meta(service, folder_id) or {}
              meta.update({
                  "status": "failed",
                  "failed_run": os.environ.get("GITHUB_RUN_ID"),
              })
              env.save_meta(service, folder_id, meta)
          print(f"queue entry {entry['id']} marked failed "
                f"(run {os.environ.get('GITHUB_RUN_ID')})")
          PY
