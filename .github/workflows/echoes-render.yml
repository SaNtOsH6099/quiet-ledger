# echoes-render: GitHub is the rendering machine for Echoes Originals.
#
# The per-video side chat does all the thinking locally (story research,
# script, Gemini Kore narration in one take, captions measured from that
# narration, AI clips, per-clip QC). When the clips are locked it puts
# them in the video's staging folder in the quiet-ledger Drive hub and
# the Hub dispatches this workflow. Actions only does the heavy,
# deterministic rendering: intake, captions render, assembly, cinema
# finish. No model is called from Actions and no brain keys are needed.
# The only secrets are the Drive OAuth token and the Drive folder id.
#
# What this workflow does NOT do:
#   - no narration (Gemini Kore, made locally by the side chat)
#   - no code scenes, no GSAP, no Kokoro, no thumbnail, no .ass
#   - no QA: frame QA is local, by the Hub, after the render returns
#   - no transfer to Echoes Drop and no clean-up of the staging folder:
#     those are Hub steps after QA passes (see docs/ECHOES.md)
# The finished video comes back to the SAME staging folder in
# quiet-ledger. The Hub then transfers the final + narration-timestamps
# file to Echoes Drop and cleans the staging folder.
#
# Trigger: manual dispatch only, with video_id, drive_folder_id and
# video_title. No schedule, no repo submission.
name: echoes-render

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video id, e.g. 79"
        required: true
        type: string
      drive_folder_id:
        description: "Per-video staging folder id in the quiet-ledger Drive hub"
        required: true
        type: string
      video_title:
        description: "Video title, e.g. The Antikythera Mechanism"
        required: true
        type: string
      final_name:
        description: "Final filename (no extension), e.g. 79-antikythera-mechanism-v1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: echoes-render
  cancel-in-progress: false

jobs:
  intake:
    name: intake locked clips from Drive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has_inputs: ${{ steps.intake.outputs.has_inputs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject stdlib-shadowing filenames
        run: python3 -m pipeline.tools.check_no_shadow
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - name: fetch the locked inputs
        id: intake
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 -m pipeline.drive.echoes_intake \
            --drive-folder-id "${{ inputs.drive_folder_id }}" \
            --out-dir in/
          echo "has_inputs=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: in/
          if-no-files-found: error
          retention-days: 7

  captions:
    name: HyperFrames karaoke captions, 24 fps
    needs: intake
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install Echoes tools
        run: python3 -m pip install -q -r requirements/echoes.txt
      - name: install ffmpeg (HyperFrames muxes frames with it)
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: in/
      - name: render the captions
        # echoes_captions.py validates the captions JSON, builds the
        # composition from echoes-hyperframes/tools/build_captions.py,
        # and renders it at 24 fps with render_captions_24fps.sh.
        run: |
          python3 -m pipeline.render.echoes_captions \
            --captions-json in/captions.json \
            --project-dir echoes-hyperframes \
            --out out/captions-24fps.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: captions
          path: out/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble + cinema finish, 24 fps, -23 LUFS
    needs: captions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: in/
      - uses: actions/download-artifact@v4
        with:
          name: captions
          path: out/
      - name: assemble and finish
        run: |
          python3 -m pipeline.render.echoes_assemble \
            --segments-dir in/clips \
            --segment-map in/segment_map.json \
            --captions out/captions-24fps.mp4 \
            --audio in/narration_mix.wav \
            --out "out/${{ inputs.final_name }}.mp4"
      - name: record size, duration, loudness
        run: |
          python3 - <<'PY'
          import json, subprocess
          out = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=width,height,r_frame_rate",
               "-show_entries", "format=duration,size",
               "-of", "json", "out/${{ inputs.final_name }}.mp4"],
              capture_output=True, text=True, check=True)
          info = json.loads(out.stdout)
          with open("out/render-report.json", "w") as f:
              json.dump({
                  "video_id": "${{ inputs.video_id }}",
                  "video_title": "${{ inputs.video_title }}",
                  "final_name": "${{ inputs.final_name }}",
                  "run_id": "${{ github.run_id }}",
                  "format": info["format"],
                  "streams": info["streams"],
              }, f, indent=2)
          print(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: out/
          if-no-files-found: error
          retention-days: 7

  return-to-drive:
    name: return the final to the staging folder
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Drive tools
        run: python3 -m pip install -q -r requirements/drive.txt
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: in/
      - uses: actions/download-artifact@v4
        with:
          name: final
          path: out/
      - name: upload final + timestamps back to staging
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # The final returns to the SAME per-video staging folder in
          # quiet-ledger, NOT to Echoes Drop. Transfer to Echoes Drop
          # and clean-up of the staging folder are Hub steps, after
          # local frame QA passes (see docs/ECHOES.md).
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "pipeline/drive")
          import video_env as env
          service = env.drive_service()
          folder_id = "${{ inputs.drive_folder_id }}"
          final = "out/${{ inputs.final_name }}.mp4"
          rec = env.upload_file(service, folder_id, final,
                                "${{ inputs.final_name }}.mp4")
          print("final in staging:", rec.get("webViewLink"))
          import glob
          for ts in glob.glob("in/narration-timestamps_*.md"):
              env.upload_file(service, folder_id, ts,
                              os.path.basename(ts))
          meta = env.load_meta(service, folder_id) or {}
          meta.update({
              "id": int("${{ inputs.video_id }}"),
              "topic": "${{ inputs.video_title }}",
              "status": "rendered",
              "final_name": "${{ inputs.final_name }}",
              "render_run_id": "${{ github.run_id }}",
              "final_link": rec.get("webViewLink"),
          })
          env.save_meta(service, folder_id, meta)
          print("meta.json updated in staging folder")
          PY
